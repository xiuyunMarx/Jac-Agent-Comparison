[project]
name = "byLLM"
version = "0.1.0"
description = "Coding agent as an OSP phase graph, for the Jac/byLLM vs Python-framework comparison"
entry-point = "orchestrator.jac"
kind = "cli"

[dependencies]

[dev-dependencies]
watchdog = ">=3.0.0"

[test]
# Tests live outside the source tree; a bare `jac test` picks them up.
directory = "tests"

[byllm.model]
# Overridable per shell with CODEAGENT_MODEL. Pinned identically on both sides
# of the comparison, or the benchmark measures the model rather than the
# framework.
default_model = "${CODEAGENT_MODEL:-gpt-4o}"
# No api_key line on purpose. `api_key = "${OPENAI_API_KEY}"` passes the literal
# string through when the variable is unset, producing a confusing
# "Incorrect API key provided: ${OPENAI_API_KEY}" at the provider. byLLM reads
# OPENAI_API_KEY from the environment natively, which fails clearly instead.

[byllm.call_params]
# temperature 0 for reproducibility; the ReAct cap is the outer loop brake.
temperature = 0.0
max_react_iterations = 25
