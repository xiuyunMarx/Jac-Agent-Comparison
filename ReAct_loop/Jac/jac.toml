[project]
name = "Jac"
version = "0.1.0"
description = "Command-line Jac project"
entry-point = "main.jac"
kind = "cli"
jac-version = "==0.37.2"

[dependencies]
requests = ">=2.31"
ddgs = "==9.16.0"
html2text = "==2025.4.15"
beautifulsoup4 = "==4.15.0"

[dev-dependencies]
watchdog = ">=3.0.0"

# Declares byLLM so `jac install` pulls litellm etc. into .jac/venv; the model
# itself is configured in main.jac.
[byllm]
