[project]
name = "openai-sdk-email-agent"
version = "0.1.0"
description = "Email auto-response agent with no orchestration framework, for the Jac/byLLM vs Python-framework comparison"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Spelled out rather than auto-discovered: the shared mock_mailbox package is
# a *sibling* directory reached via sys.path (main.py inserts ../), exactly as
# the other two implementations reach it -- none of the three installs it, so
# nothing here may claim it.
[tool.setuptools]
py-modules = ["main", "nodes", "llm"]

# The model is pinned identically on all three sides of the comparison, or the
# benchmark measures the model rather than the framework. Overridable per shell
# with OPENAI_MODEL_NAME, the same knob crewai (via litellm) and byLLM
# (nodes.jac) read; gpt-4o is byLLM's default, and byLLM is the fidelity
# target. Temperature 0.7 is byllm's default call_params, matched in llm.py.
# The API key is read from OPENAI_API_KEY by the openai SDK natively (or from
# a .env next to main.py) and is deliberately not configured here.
[tool.emailagent]
default_model = "gpt-4o"
temperature = 0.7
max_tool_rounds = 10
