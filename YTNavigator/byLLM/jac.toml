[project]
name = "byLLM"
version = "0.1.0"
description = "byLLM counterpart of the YT-Navigator chat agent"
entry-point = "main.jac"
kind = "cli"

[dependencies]
psycopg2-binary = ">=2.9"
sentence-transformers = ">=3.0"

# Declares the byLLM "llm" capability so `jac install` pulls the compiler's
# pinned litellm into .jac/venv (jac 0.37+ installs per project).
[byllm]
