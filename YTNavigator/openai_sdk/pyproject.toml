[project]
name = "openai-sdk-ytnavigator"
version = "0.1.0"
description = "YT-Navigator chat agent with no orchestration framework, for the Jac/byLLM vs Python-framework comparison"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    # What ../byLLM/retrieval.py (loaded from the sibling, not copied) needs:
    "psycopg2-binary>=2.9",
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "llm", "main", "prompts", "tools"]

# The models are hard-coded identically on all three sides of the comparison;
# no env override. The API key is read from
# OPENAI_API_KEY by the openai SDK natively and is deliberately not
# configured here.
[tool.ytnavigator]
instant_llm = "ollama_chat/glm-5.2:cloud"
powerful_llm = "ollama_chat/glm-5.2:cloud"
temperature = 0.0
max_react_iterations = 6
