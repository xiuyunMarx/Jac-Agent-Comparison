[project]
name = "langgraph-codeagent"
version = "0.2.0"
description = "Coding agent using LangGraph phases and standard LangChain agents"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "langchain>=1.2,<2",
    "langchain-core>=1.2,<2",
    "langchain-openai>=1.1,<2",
    "pydantic>=2.0,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "nodes", "orchestrator"]

[project.scripts]
codeagent = "main:solve"
