[project]
name = "langgraph-codeagent"
version = "0.2.0"
description = "Coding agent as a LangGraph phase graph; the LangGraph twin of ../Jac"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.3.5",
    "langchain-core>=0.3.60",
    "langchain-openai>=0.3.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "nodes", "phase_agent", "orchestrator"]

[project.scripts]
codeagent = "main:solve"
