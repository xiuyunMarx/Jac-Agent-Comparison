[project]
name = "openai-sdk-codeagent"
version = "0.2.0"
description = "Coding agent as a phase graph with no orchestration framework; the no-framework twin of ../Jac"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "nodes", "phase_agent", "orchestrator"]

[project.scripts]
codeagent = "main:solve"
