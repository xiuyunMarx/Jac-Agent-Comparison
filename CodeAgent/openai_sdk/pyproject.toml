[project]
name = "openai-sdk-codeagent"
version = "0.1.0"
description = "Coding agent as a phase graph with no orchestration framework, for the Jac/byLLM vs Python-framework comparison"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Spelled out rather than auto-discovered, for the same reason as
# ../langgraph/pyproject.toml: setuptools' flat-layout scan drops `tools` -- it
# is on its list of directory names that are usually not packages -- so an
# editable install would quietly ship the top-level modules and no tool surface,
# and the first `import tools.common` would fail at runtime.
[tool.setuptools]
py-modules = ["orchestrator", "phase_agent", "llm", "llm_log", "telemetry"]
packages = ["tools"]

[project.scripts]
codeagent = "orchestrator:main"

# The model is hard-coded identically on all three sides of the comparison; no
# env override. The API key is read from OPENAI_API_KEY by the openai SDK natively and
# is deliberately not configured here: writing `api_key = "${OPENAI_API_KEY}"`
# passes the literal string through when the variable is unset, producing a
# confusing "Incorrect API key provided: ${OPENAI_API_KEY}" at the provider.
[tool.codeagent]
default_model = "ollama_chat/glm-5.2"
temperature = 0.0
max_react_iterations = 25
