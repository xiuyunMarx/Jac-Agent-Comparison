[project]
name = "langgraph-codeagent"
version = "0.1.0"
description = "Coding agent as a LangGraph phase graph, for the Jac/byLLM vs Python-framework comparison"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.3.5",
    "langchain-core>=0.3.60",
    "langchain-openai>=0.3.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Spelled out rather than auto-discovered. setuptools' flat-layout scan drops
# `tools` -- it is on its list of directory names that are usually not packages
# -- so an editable install would quietly ship the three top-level modules and
# no tool surface, and the first `import tools.common` would fail at runtime.
[tool.setuptools]
py-modules = ["orchestrator", "phase_agent", "telemetry"]
packages = ["tools"]

[project.scripts]
codeagent = "orchestrator:main"

[tool.pytest.ini_options]
# Tests live outside the source tree, and the modules under test sit at the
# project root; without this pytest only puts tests/ on sys.path.
testpaths = ["tests"]
pythonpath = ["."]

# The model is pinned identically on both sides of the comparison, or the
# benchmark measures the model rather than the framework. Overridable per shell
# with CODEAGENT_MODEL, exactly as byLLM/jac.toml does it. The API key is read
# from OPENAI_API_KEY by langchain-openai natively and is deliberately not
# configured here.
[tool.codeagent]
default_model = "gpt-4o"
temperature = 0.0
max_react_iterations = 25
