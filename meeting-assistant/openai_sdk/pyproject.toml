[project]
name = "openai-sdk-meeting-assistant"
version = "0.1.0"
description = "Meeting assistant with no orchestration framework, for the Jac/byLLM vs Python-framework comparison"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Spelled out rather than auto-discovered, as in ../../CodeAgent/openai_sdk:
# three flat modules, nothing to scan for. Installation is optional -- the
# eval harness runs main.py by path with whatever interpreter has `openai`.
[tool.setuptools]
py-modules = ["main", "nodes", "tools"]

[project.scripts]
meeting-assistant = "main:main"

# The model is pinned identically on all three sides of the comparison, or
# the benchmark measures the model rather than the framework. Neither CrewAI
# nor byLLM offers an env-var override here, so this side does not either.
# The API key is read from OPENAI_API_KEY by the openai SDK natively.
[tool.meeting-assistant]
model = "gpt-4o"
temperature = 0.7
